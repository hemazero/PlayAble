<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swipe Market 3D: Cloud Edition</title>
    <style>
        :root {
            --bg-base: #0a0d14;
            --bg-fog: radial-gradient(circle at 50% 50%, #1a2236 0%, #0a0d14 100%);
            --bg-surface: rgba(22, 27, 38, 0.7);
            --bg-surface-elevated: rgba(35, 43, 58, 0.85);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --success: #34d399;
            --danger: #f87171;
            --card-grad: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-base);
            background-image: var(--bg-fog);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            touch-action: none;
            padding-bottom: env(safe-area-inset-bottom, 15px);
        }

        /* Ambient Fog and Vignette Layers */
        .fog-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 30%, transparent 20%, rgba(10, 13, 20, 0.8) 90%);
            pointer-events: none;
            z-index: 2;
        }

        /* Top Display Dashboard */
        .dashboard {
            width: 100%;
            max-width: 420px;
            text-align: center;
            padding: 30px 20px 10px 20px;
            z-index: 10;
            backdrop-filter: blur(4px);
        }

        .balance-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            margin-bottom: 4px;
        }

        #balance {
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: -1.5px;
            background: linear-gradient(to bottom, #ffffff 70%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
        }

        .currency-label {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--success);
            text-shadow: 0 0 15px rgba(52, 211, 153, 0.4);
        }

        #cps-display {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
            background: rgba(15, 23, 42, 0.6);
            padding: 4px 14px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Swiper Track Viewport */
        .swiper-viewport {
            width: 100%;
            max-width: 420px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            position: relative;
            z-index: 5;
        }

        /* Terminal Reader Base */
        .terminal-track {
            position: relative;
            width: 300px;
            height: 120px;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            padding: 0 20px;
            transform: rotateX(15deg);
            transform-style: preserve-3d;
            backdrop-filter: blur(8px);
        }

        .terminal-slot {
            position: absolute;
            left: 15px;
            right: 15px;
            height: 54px;
            background: #090d16;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.7);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 15px;
            color: #334155;
            font-weight: 800;
            letter-spacing: 1.5px;
            font-size: 0.7rem;
        }

        /* Interactive 3D Card */
        .payment-card {
            position: absolute;
            left: 20px;
            width: 120px;
            height: 76px;
            background: var(--card-grad);
            border-radius: 12px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.4);
            cursor: grab;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            transform: translateZ(25px);
            transform-style: preserve-3d;
            z-index: 5;
            -webkit-tap-highlight-color: transparent;
        }

        .card-chip {
            width: 20px;
            height: 14px;
            background: linear-gradient(135deg, #fef08a, #ca8a04);
            border-radius: 3px;
        }

        .card-number {
            font-family: monospace;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.8);
            letter-spacing: 1px;
        }

        /* Floating Swipe Text Particles */
        .floating-text {
            position: absolute;
            color: #ffffff;
            font-size: 1.6rem;
            font-weight: 900;
            pointer-events: none;
            animation: floatAway 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            text-shadow: 0 4px 12px rgba(52, 211, 153, 0.5), 0 0 2px #000;
            z-index: 100;
        }

        @keyframes floatAway {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
            20% { opacity: 1; transform: translate(-50%, -80%) scale(1.1); }
            100% { opacity: 0; transform: translate(-20%, -150px) scale(0.8); }
        }

        /* Upgrades Scrollable Frame Layout */
        .scroll-wrapper {
            flex: 1;
            width: 100%;
            max-width: 420px;
            overflow-y: auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
            mask-image: linear-gradient(to bottom, transparent 0%, black 3%, black 95%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 3%, black 95%, transparent 100%);
        }

        .upgrade-card {
            background: var(--bg-surface);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: background 0.15s ease, opacity 0.2s ease, transform 0.1s ease;
            backdrop-filter: blur(6px);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .upgrade-card:active {
            transform: scale(0.98);
            background: var(--bg-surface-elevated);
        }

        .upgrade-card.disabled {
            opacity: 0.25;
            cursor: not-allowed;
            pointer-events: none;
            box-shadow: none;
        }

        .upgrade-info {
            display: flex;
            flex-direction: column;
            max-width: 70%;
        }

        .upgrade-name {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .upgrade-effect {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .upgrade-meta {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .upgrade-cost {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--success);
        }

        .upgrade-card.disabled .upgrade-cost {
            color: var(--text-muted);
        }

        .upgrade-count {
            font-size: 0.7rem;
            color: #818cf8;
            font-weight: 700;
            background: rgba(99, 102, 241, 0.15);
            padding: 1px 6px;
            border-radius: 5px;
            align-self: flex-end;
        }

        /* System Controls Bar */
        .controls {
            padding: 15px 20px;
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(4px);
        }

        .save-indicator {
            font-size: 0.75rem;
            color: var(--success);
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .save-indicator.show {
            opacity: 1;
        }

        .reset-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--danger);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="fog-overlay"></div>

    <div class="dashboard">
        <div class="balance-container">
            <span id="balance">0</span><span class="currency-label">$</span>
        </div>
        <div id="cps-display">CPS: 0.0</div>
    </div>

    <div class="swiper-viewport" id="track-viewport">
        <div class="terminal-track">
            <div class="terminal-slot">SLIDE TO SETTLE GENTLY ➔</div>
            <div class="payment-card" id="swipe-card">
                <div class="card-chip"></div>
                <div class="card-number">•••• •••• •••• 2026</div>
            </div>
        </div>
    </div>

    <!-- Scrollable framework housing all 20 unique items -->
    <div class="scroll-wrapper" id="upgrades-box"></div>

    <div class="controls">
        <span class="save-indicator" id="save-status">● Core Ledger Synced</span>
        <button class="reset-btn" id="reset-btn">Reset Account</button>
    </div>

    <script>
        // Core Game Matrix Definition supporting 20 separate tiered upgrades
        let gameState = {
            coins: 0,
            upgrades: {
                // Click Upgrades Group (1-5)
                u1: { name: "💳 Matte Finish", type: "click", owned: 0, cost: 10, mult: 1.14, power: 1, desc: "+1 per swipe" },
                u2: { name: "🛡️ Embossed Digits", type: "click", owned: 0, cost: 120, mult: 1.15, power: 5, desc: "+5 per swipe" },
                u3: { name: "✨ Magnetic Polish", type: "click", owned: 0, cost: 850, mult: 1.16, power: 25, desc: "+25 per swipe" },
                u4: { name: "💎 Platinum Core", type: "click", owned: 0, cost: 6200, mult: 1.16, power: 120, desc: "+120 per swipe" },
                u5: { name: "🌌 Carbon Quantum", type: "click", owned: 0, cost: 45000, mult: 1.18, power: 750, desc: "+750 per swipe" },
                
                // Automation Upgrades Group (6-20)
                u6: { name: "💸 Micro Cashback", type: "auto", owned: 0, cost: 40, mult: 1.15, power: 0.5, desc: "+0.5 CPS" },
                u7: { name: "📱 Mobile Wallet", type: "auto", owned: 0, cost: 260, mult: 1.15, power: 2, desc: "+2.0 CPS" },
                u8: { name: "🏦 Direct Deposit", type: "auto", owned: 0, cost: 1500, mult: 1.15, power: 10, desc: "+10.0 CPS" },
                u9: { name: "🤖 Smart Contracts", type: "auto", owned: 0, cost: 7800, mult: 1.15, power: 45, desc: "+45.0 CPS" },
                u10: { name: "🏪 Local Merchant", type: "auto", owned: 0, cost: 34000, mult: 1.15, power: 180, desc: "+180 CPS" },
                u11: { name: "🚛 Supply Chain", type: "auto", owned: 0, cost: 180000, mult: 1.14, power: 820, desc: "+820 CPS" },
                u12: { name: "🏢 Mega Logistics", type: "auto", owned: 0, cost: 920000, mult: 1.14, power: 4200, desc: "+4.2K CPS" },
                u13: { name: "📡 High Frequency", type: "auto", owned: 0, cost: 4800000, mult: 1.14, power: 21000, desc: "+21K CPS" },
                u14: { name: "🛰️ Satellite Nodes", type: "auto", owned: 0, cost: 26000000, mult: 1.13, power: 115000, desc: "+115K CPS" },
                u15: { name: "🧬 Neural Clearing", type: "auto", owned: 0, cost: 150000000, mult: 1.13, power: 680000, desc: "+680K CPS" },
                u16: { name: "🔋 Fusion Servers", type: "auto", owned: 0, cost: 950000000, mult: 1.13, power: 4100000, desc: "+4.1M CPS" },
                u17: { name: "🪐 Orbital Banking", type: "auto", owned: 0, cost: 6800000000, mult: 1.12, power: 26000000, desc: "+26M CPS" },
                u18: { name: "⚡ Singularity Hub", type: "auto", owned: 0, cost: 45000000000, mult: 1.12, power: 180000000, desc: "+180M CPS" },
                u19: { name: "🌌 Galactic Lattice", type: "auto", owned: 0, cost: 320000000000, mult: 1.12, power: 1200000000, desc: "+1.2B CPS" },
                u20: { name: "⏳ Chrono Ledger", type: "auto", owned: 0, cost: 2500000000000, mult: 1.11, power: 9500000000, desc: "+9.5B CPS" }
            }
        };

        // Web Audio Synthesizer Framework
        let audioCtx = null;
        function playAudioTone(freq, type, duration, vol) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // Action sound configurations
        function playSwipeBuzz() {
            playAudioTone(130, 'sawtooth', 0.12, 0.18);
        }

        function playPurchaseChime() {
            // Complex multi-layered chime for upgrade purchases
            playAudioTone(587.33, 'triangle', 0.08, 0.15); // D5
            setTimeout(() => playAudioTone(880, 'triangle', 0.15, 0.12), 60); // A5
        }

        const balanceEl = document.getElementById('balance');
        const cpsEl = document.getElementById('cps-display');
        const cardEl = document.getElementById('swipe-card');
        const upgradesBox = document.getElementById('upgrades-box');
        const saveStatusEl = document.getElementById('save-status');
        const resetBtn = document.getElementById('reset-btn');

        // Layout Tracking variables
        const MIN_X = 20;
        const MAX_X = 140;
        let isDragging = false;
        let startX = 0;
        let currentX = MIN_X;
        let hasTriggeredThisSwipe = false;

        // Cost Calculation Engine
        function getCurrentCost(key) {
            const u = gameState.upgrades[key];
            return Math.floor(u.cost * Math.pow(u.mult, u.owned));
        }

        function getClickPower() {
            let p = 1;
            for (const k in gameState.upgrades) {
                if (gameState.upgrades[k].type === "click") {
                    p += gameState.upgrades[k].owned * gameState.upgrades[k].power;
                }
            }
            return p;
        }

        function getTotalCPS() {
            let c = 0;
            for (const k in gameState.upgrades) {
                if (gameState.upgrades[k].type === "auto") {
                    c += gameState.upgrades[k].owned * gameState.upgrades[k].power;
                }
            }
            return c;
        }

        function formatNumber(num) {
            if (num >= 1e12) return (num / 1e12).toFixed(2) + 'T';
            if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
            return Math.floor(num).toString();
        }

        // Procedural Element Factory for Upgrades
        function generateUpgradeElements() {
            upgradesBox.innerHTML = '';
            Object.keys(gameState.upgrades).forEach(key => {
                const u = gameState.upgrades[key];
                
                const card = document.createElement('div');
                card.className = 'upgrade-card';
                card.id = `card-${key}`;
                
                card.innerHTML = `
                    <div class="upgrade-info">
                        <span class="upgrade-name">${u.name}</span>
                        <span class="upgrade-effect">${u.desc}</span>
                    </div>
                    <div class="upgrade-meta">
                        <span class="upgrade-cost" id="cost-${key}">$0</span>
                        <span class="upgrade-count" id="count-${key}">0</span>
                    </div>
                `;
                
                card.addEventListener('click', () => attemptUpgradePurchase(key));
                upgradesBox.appendChild(card);
            });
        }

        function updateUI() {
            balanceEl.textContent = formatNumber(gameState.coins);
            cpsEl.textContent = `CPS: ${formatNumber(getTotalCPS())}`;

            Object.keys(gameState.upgrades).forEach(key => {
                const card = document.getElementById(`card-${key}`);
                const costEl = document.getElementById(`cost-${key}`);
                const countEl = document.getElementById(`count-${key}`);
                const currentCost = getCurrentCost(key);

                costEl.textContent = `$${formatNumber(currentCost)}`;
                countEl.textContent = gameState.upgrades[key].owned;

                if (gameState.coins >= currentCost) {
                    card.classList.remove('disabled');
                } else {
                    card.classList.add('disabled');
                }
            });
        }

        function spawnFloatingText(x, y, text) {
            const floating = document.createElement('div');
            floating.className = 'floating-text';
            floating.textContent = text;
            floating.style.left = `${x}px`;
            floating.style.top = `${y}px`;
            document.body.appendChild(floating);
            floating.addEventListener('animationend', () => floating.remove());
        }

        /* Gesture Recognition Core Engine */
        function onDragStart(e) {
            isDragging = true;
            hasTriggeredThisSwipe = false;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            startX = clientX - (currentX - MIN_X);
            cardEl.style.transition = 'none';
        }

        function onDragMove(e) {
            if (!isDragging) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let deltaX = clientX - startX;
            
            currentX = MIN_X + deltaX;
            if (currentX < MIN_X) currentX = MIN_X;
            if (currentX > MAX_X) currentX = MAX_X;

            const tiltRotation = ((currentX - MIN_X) / (MAX_X - MIN_X)) * 8;
            cardEl.style.transform = `translateX(${currentX - MIN_X}px) translateZ(25px) rotateY(${tiltRotation}deg)`;

            if (currentX >= MAX_X && !hasTriggeredThisSwipe) {
                hasTriggeredThisSwipe = true;
                executeSwipeIncome(e);
            }
        }

        function onDragEnd() {
            if (!isDragging) return;
            isDragging = false;
            cardEl.style.transition = 'transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.2)';
            cardEl.style.transform = 'translateX(0px) translateZ(25px) rotateY(0deg)';
            currentX = MIN_X;
        }

        function executeSwipeIncome(e) {
            playSwipeBuzz();
            const clickPower = getClickPower();
            gameState.coins += clickPower;

            let textX = window.innerWidth / 2 + 30;
            let textY = window.innerHeight / 2 - 10;
            if (e.touches && e.touches[0]) {
                textX = e.touches[0].clientX;
                textY = e.touches[0].clientY;
            } else if (e.clientX) {
                textX = e.clientX;
                textY = e.clientY;
            }

            spawnFloatingText(textX, textY, `+$${formatNumber(clickPower)}`);
            updateUI();
        }

        function attemptUpgradePurchase(key) {
            const cost = getCurrentCost(key);
            if (gameState.coins >= cost) {
                gameState.coins -= cost;
                gameState.upgrades[key].owned++;
                playPurchaseChime();
                updateUI();
            }
        }

        function saveGame() {
            localStorage.setItem('idleSwipeCloudSave20', JSON.stringify(gameState));
            saveStatusEl.classList.add('show');
            setTimeout(() => saveStatusEl.classList.remove('show'), 1200);
        }

        function loadGame() {
            const savedData = localStorage.getItem('idleSwipeCloudSave20');
            if (savedData) {
                try {
                    const parsed = JSON.parse(savedData);
                    if (parsed && typeof parsed === 'object') {
                        if (typeof parsed.coins === 'number') gameState.coins = parsed.coins;
                        for (const key in parsed.upgrades) {
                            if (gameState.upgrades[key]) {
                                gameState.upgrades[key].owned = parsed.upgrades[key].owned || 0;
                            }
                        }
                    }
                } catch (err) {}
            }
            generateUpgradeElements();
            updateUI();
        }

        function resetGame() {
            if (confirm("Reset ledger and clear purchase histories?")) {
                gameState.coins = 0;
                for (const key in gameState.upgrades) {
                    gameState.upgrades[key].owned = 0;
                }
                saveGame();
                updateUI();
            }
        }

        // Gesture listeners binding
        cardEl.addEventListener('touchstart', onDragStart, { passive: true });
        window.addEventListener('touchmove', onDragMove, { passive: true });
        window.addEventListener('touchend', onDragEnd);

        cardEl.addEventListener('mousedown', onDragStart);
        window.addEventListener('mousemove', onDragMove);
        window.addEventListener('mouseup', onDragEnd);

        resetBtn.addEventListener('click', resetGame);

        // Standard loops
        setInterval(() => {
            const passiveEarnings = getTotalCPS() / 10;
            if (passiveEarnings > 0) {
                gameState.coins += passiveEarnings;
                updateUI();
            }
        }, 100);

        setInterval(saveGame, 5000);
        window.onload = loadGame;
    </script>
</body>
</html>
