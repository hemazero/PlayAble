<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تشغيل فيديو Google Drive</title>
  <style>
    body {
      background-color: #0d0e15;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 9 / 16;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.25);
      border: 2px solid #1f2338;
      background-color: #000;
    }

    /* شاشة التحميل الثنائية اللغة */
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0d0e15;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #00ffcc;
      z-index: 3;
      transition: opacity 0.5s ease;
      text-align: center;
      padding: 15px;
      box-sizing: border-box;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(0, 255, 204, 0.2);
      border-top: 4px solid #00ffcc;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-ar {
      font-size: 16px;
      font-weight: bold;
    }

    .loading-en {
      font-size: 13px;
      color: rgba(0, 255, 204, 0.75);
      margin-top: 2px;
      direction: ltr;
    }

    /* تنبيه رفع الصوت (عربي + إنجليزي) */
    .volume-hint {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: #ffffff;
      animation: pulseText 1.5s infinite ease-in-out;
    }

    .volume-ar {
      font-size: 14px;
      font-weight: bold;
    }

    .volume-en {
      font-size: 12px;
      opacity: 0.8;
      direction: ltr;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.65; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    /* طبقة كلمة التشغيل النصية والمتطايرة (عربي + إنجليزي) */
    .play-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.5s ease;
      
      /* تجعل الطبقة خيالاً لا يمنع النقر المباشر على الفيديو */
      pointer-events: none; 
    }

    .play-text-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #00ffcc;
      user-select: none;
      text-shadow: 0 0 12px rgba(0, 255, 204, 0.8), 0 0 24px rgba(0, 255, 204, 0.4);
      animation: floatText 2s infinite ease-in-out;
    }

    .play-ar {
      font-size: 26px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .play-en {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      opacity: 0.95;
      direction: ltr;
    }

    @keyframes floatText {
      0%, 100% {
        transform: translateY(0) scale(1);
        text-shadow: 0 0 12px rgba(0, 255, 204, 0.8), 0 0 24px rgba(0, 255, 204, 0.4);
      }
      50% {
        transform: translateY(-8px) scale(1.08);
        text-shadow: 0 0 20px rgba(0, 255, 204, 1), 0 0 35px rgba(0, 255, 204, 0.7);
      }
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="video-wrapper">

    <!-- شاشة التحميل (عربي + إنجليزي) -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-ar">جاري تحميل الفيديو...</div>
      <div class="loading-en">Loading video...</div>
      
      <div class="volume-hint">
        <div class="volume-ar">🔊 ارفع مستوى الصوت</div>
        <div class="volume-en">Turn up the volume</div>
      </div>
    </div>

    <!-- كلمة تشغيل المتطايرة (عربي + إنجليزي) -->
    <div class="play-overlay" id="playOverlay">
      <div class="play-text-box">
        <div class="play-ar"><span>▶</span> تشغيل</div>
        <div class="play-en">PLAY</div>
      </div>
    </div>

    <!-- iframe الفيديو -->
    <iframe 
      src="https://drive.google.com/file/d/1yo37bubveK8kRHAlV5xEFDYenkILssnG/preview?autoplay=1" 
      allow="autoplay; encrypted-media; picture-in-picture" 
      allowfullscreen
      onload="onIframeLoad()">
    </iframe>

  </div>

  <script>
    function onIframeLoad() {
      const loadingOverlay = document.getElementById('loadingOverlay');
      const playOverlay = document.getElementById('playOverlay');

      if (loadingOverlay) {
        // إخفاء شاشة التحميل
        loadingOverlay.style.opacity = '0';
        
        setTimeout(() => {
          loadingOverlay.style.display = 'none';
          
          // إظهار النص الصافي المتطاير باللغتين
          if (playOverlay) {
            playOverlay.style.opacity = '1';

            // إخفاء النص تلقائياً بعد ثانيتين (2000 مللي ثانية)
            setTimeout(() => {
              playOverlay.style.opacity = '0';
              setTimeout(() => {
                playOverlay.style.display = 'none';
              }, 500);
            }, 2000);

          }
        }, 500);
      }
    }
  </script>

</body>
</html>
